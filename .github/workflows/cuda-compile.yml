---
name: CUDA 13 compile-only

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cuda-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-compile:
    name: Pinned CUDA 13 ABI and missing-driver fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: "nvidia/cuda:13.0.2-devel-ubuntu22.04@sha256:\
        1c517d4fb96528c8999e14e6e6b16d7e2ff9ae8d194fd788d60fdc88e693e982"
      env:
        NVIDIA_VISIBLE_DEVICES: void
        MARKOVIAN_CUDA_DRIVER_LIBRARY: /__markovian_compile_only__/libcuda.so.1

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            ca-certificates \
            curl \
            gcc \
            git \
            libgmp-dev \
            python3 \
            zlib1g-dev

      - name: Check out without credentials
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read pinned Haskell versions
        id: toolchain
        run: |
          set -euo pipefail
          source toolchain.env
          echo "ghc=${MARKOVIAN_GHC_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "cabal=${MARKOVIAN_CABAL_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Haskell
        # haskell-actions/setup v2.12.0
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d
        with:
          ghc-version: ${{ steps.toolchain.outputs.ghc }}
          cabal-version: ${{ steps.toolchain.outputs.cabal }}

      - name: Verify pinned image, header, PTX, and generated header
        run: |
          set -euo pipefail
          source backends/markovian-gpu/toolchain.env
          expected_image="nvidia/cuda:13.0.2-devel-ubuntu22.04@sha256:"
          expected_image+="1c517d4fb96528c8999e14e6e6b16d7e2ff9ae8d194fd788d60fdc88e693e982"
          actual_image="${MARKOVIAN_CUDA_COMPILE_IMAGE}"
          if [[ "${actual_image}" != "${expected_image}" ]]; then
            printf 'Expected compile image %s, found %s.\n' \
              "${expected_image}" "${actual_image}" >&2
            exit 1
          fi
          "${MARKOVIAN_NVCC}" --version
          cuda_root="$(cd "$(dirname "${MARKOVIAN_NVCC}")/.." && pwd)"
          sha256sum "${cuda_root}/include/cuda.h"
          bash backends/markovian-gpu/scripts/build-ptx
          git -c safe.directory="${GITHUB_WORKSPACE}" diff --exit-code -- \
            backends/markovian-gpu/cbits/markovian_dense.ptx \
            backends/markovian-gpu/cbits/markovian_dense_ptx.h \
            backends/markovian-gpu/src/Markovian/Backend/GPU/Artifact.hs
          source backends/markovian-gpu/toolchain.env
          cp backends/markovian-gpu/cbits/markovian_dense.ptx /tmp/corrupt.ptx
          printf '\ncorrupt\n' >> /tmp/corrupt.ptx
          if printf '%s  %s\n' \
            "${MARKOVIAN_CUDA_PTX_SHA256}" /tmp/corrupt.ptx \
            | sha256sum --check --status; then
            echo "Deliberately corrupted PTX passed digest admission." >&2
            exit 1
          fi

      - name: Compile the complete enabled C and Haskell path
        run: |
          set -euo pipefail
          cc \
            -I/usr/local/cuda/include \
            -Ibackends/markovian-gpu/cbits \
            -std=c11 -Wall -Wextra -Werror -pedantic \
            -Wno-overlength-strings \
            -DMARKOVIAN_CUDA_FAULT_INJECTION \
            -fsyntax-only backends/markovian-gpu/cbits/markovian_gpu.c
          cabal build markovian-gpu:lib:markovian-gpu \
            --project-file=cabal.project.ci \
            -fcuda -fcuda-fault-injection \
            --extra-include-dirs=/usr/local/cuda/include

      - name: Run missing-library and missing-symbol contracts without a GPU
        run: |
          set -euo pipefail
          cc -shared -fPIC -Wall -Wextra -Werror -pedantic \
            -DOMIT_CUINIT \
            backends/markovian-gpu/test/cbits/incomplete_cuda_driver.c \
            -o /tmp/libcuda-incomplete-early.so
          cc -shared -fPIC -Wall -Wextra -Werror -pedantic \
            -DOMIT_CULAUNCHKERNEL \
            backends/markovian-gpu/test/cbits/incomplete_cuda_driver.c \
            -o /tmp/libcuda-incomplete-late.so
          rm -f /tmp/markovian-cuinit-called
          early_driver=/tmp/libcuda-incomplete-early.so
          late_driver=/tmp/libcuda-incomplete-late.so
          MARKOVIAN_CUDA_EARLY_INCOMPLETE_DRIVER="${early_driver}"
          MARKOVIAN_CUDA_LATE_INCOMPLETE_DRIVER="${late_driver}"
          export MARKOVIAN_CUDA_EARLY_INCOMPLETE_DRIVER
          export MARKOVIAN_CUDA_LATE_INCOMPLETE_DRIVER
          export MARKOVIAN_CUDA_INIT_MARKER=/tmp/markovian-cuinit-called
          cabal test markovian-gpu-test \
            --project-file=cabal.project.ci \
            -fcuda -fcuda-fault-injection \
            --extra-include-dirs=/usr/local/cuda/include \
            --test-show-details=direct
          executable="$(cabal list-bin markovian-gpu-test \
            --project-file=cabal.project.ci \
            -fcuda -fcuda-fault-injection \
            --extra-include-dirs=/usr/local/cuda/include)"
          if ldd "${executable}" | grep -F 'libcuda'; then
            message="Enabled executable has an unexpected startup "
            message+="dependency on libcuda."
            printf '%s\n' "${message}" >&2
            exit 1
          fi
          bash backends/markovian-gpu/scripts/check-device-boundary
